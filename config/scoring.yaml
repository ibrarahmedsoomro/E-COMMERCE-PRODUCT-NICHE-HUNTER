# Composite Scoring Model & Decision Verdict Thresholds

scoring:
  # Dimension Weights (Must sum to 1.0)
  weights:
    profitability: 0.25      # Gross & Net margin strength
    demand_traction: 0.20    # Search volume, sales velocity, CAGR
    competitive_gap: 0.20    # Rating weakness in existing market, review ceiling
    differentiation_moat: 0.15 # AI-assessed uniqueness, bundle potential, patent safety
    trend_momentum: 0.10     # Google trends slope, seasonality stability
    risk_profile: 0.10       # Returns rate, compliance risk, fragility

  # Decision Matrix Thresholds (0 - 100 Scale)
  thresholds:
    launch_min_score: 70.0          # Score >= 70.0 AND zero critical/high risks -> LAUNCH
    watchlist_min_score: 55.0       # Score >= 55.0 -> WATCHLIST
    # Below 55.0 -> REJECT


  # Confidence Multiplier Settings
  confidence:
    base_offset: 0.0                # Removed arbitrary +10 offset for clean probabilistic math
    min_sources_for_full_confidence: 3
    source_weights:
      marketplace_api: 0.40         # Keepa / Rainforest / Jungle Scout
      trend_tracker: 0.25           # Google Trends
      review_nlp: 0.20              # Reddit / Amazon Q&A sentiment
      supplier_benchmark: 0.15      # 1688 / Alibaba / Benchmark DB
